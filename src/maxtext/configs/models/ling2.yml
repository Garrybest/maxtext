# Ling2 model config (hybrid MLA/GLA + MoE architecture)
#
# Fields marked [NEW] require PR1 config extension in types.py.
# All other fields already exist in upstream MaxText.

# Core architecture
decoder_block: "ling2"
weight_dtype: 'float32'
dtype: 'bfloat16'
base_emb_dim: 2048
base_mlp_dim: 5120
base_num_decoder_layers: 20
mtp_num_layers: 1
vocab_size: 157184
first_num_dense_layers: 1
mlp_activations: ["silu", "linear"]
normalization_layer_epsilon: 1.0e-6

# Attention
base_num_query_heads: 16
base_num_kv_heads: 16
head_dim: 128
use_qk_norm: true
enable_dropout: false
logits_via_embedding: false

## MLA (Multi-Head Latent Attention)
attention_type: "mla"
q_lora_rank: 256
kv_lora_rank: 512
qk_nope_head_dim: 128
qk_rope_head_dim: 64
v_head_dim: 128
mscale: 1.0
mla_interleaved_rope: true             # [NEW] de-interleave RoPE dims before rotary embedding
dropout_rate: 0.0

# Hybrid attention (MLA + GLA)
# Every inhomogeneous_layer_cycle_interval layers, the last layer uses MLA (full attention),
# the rest use GLA (linear attention).
inhomogeneous_layer_cycle_interval: 5  # 4 GLA + 1 MLA per group
group_norm_size: 4                     # [NEW] GroupRMSNorm group size for GLA output

# MoE (Mixture of Experts)
num_experts: 256
num_experts_per_tok: 8
base_moe_mlp_dim: 512
moe_shared_expert_dim: 2048            # [NEW] shared expert FFN width (differs from routed experts)
shared_experts: 1
routed_scaling_factor: 2.5
n_routing_groups: 8
topk_routing_group: 4

# Routing
routed_score_func: "sigmoid"
routed_bias: true
routed_bias_dtype: "float32"           # [NEW] keep bias in fp32 for stability
enable_routed_bias_grad: false         # [NEW] freeze bias from optimizer; loss-free balancing only
routed_bias_update_rate: 0.001
routed_bias_zero_mean_update: true     # [NEW] recenter bias to zero-mean after each update
norm_topk_prob: false

# Numerics
float32_logits: true
use_linear_silu: false                 # [NEW] no SiLU on GLA QKV projection

# RoPE
rope_min_timescale: 1
rope_max_timescale: 10000
max_position_embeddings: 4096
original_max_position_embeddings: 4096
rope_factor: 32
partial_rotary_factor: 0.5

# Sequence
max_target_length: 4096
max_prefill_predict_length: 4096
scan_layers: false

# Training
add_bos: false
calculate_per_token_loss: false        # [NEW] micro-batch independent averaging for GA
