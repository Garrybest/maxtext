# Ling3 Tiny Pretrain - K8s JobSet (64 chips / 128 devices, 4x4x4)
# Rendered by envsubst via scripts/submit_ling3_64chips_job.sh
# IMPORTANT: Use explicit envsubst variable whitelist to avoid clobbering
# runtime variables (GITHUB_TOKEN, JOB_COMPLETION_INDEX, LOG_FILE, RUN_NAME)
# used in the inline bash script below.
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOB_NAME}
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
  labels:
    app: tpu-64chips-ling3-job
    repo-branch: "${BRANCH_LABEL}"
    owner: "${USER}"
spec:
  failurePolicy:
    maxRestarts: 3
    rules:
    - name: restart_on_failure
      action: RestartJobSet
      onJobFailureReasons:
      - BackoffLimitExceeded
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          app: tpu-64chips-ling3-job
          repo-branch: "${BRANCH_LABEL}"
          owner: "${USER}"
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 16
        parallelism: 16
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
            labels:
              app: tpu-64chips-ling3-job
              repo-branch: "${BRANCH_LABEL}"
              owner: "${USER}"
          spec:
            containers:
            - name: jax-tpu
              image: python:3.12
              imagePullPolicy: IfNotPresent
              command:
              - bash
              - -c
              - |
                set -exo pipefail

                # 0. Configure git credentials for private repos
                git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

                # 1. Clone branch
                git clone --depth=1 --branch="${BRANCH}" https://github.com/primatrix/maxtext.git /root/maxtext
                cd /root/maxtext

                # 2. Setup Python environment
                pip install uv
                uv venv --python 3.12 --seed maxtext_venv
                source maxtext_venv/bin/activate
                uv pip install -e '.[tpu]' --resolution=lowest
                install_maxtext_tpu_github_deps

                # 2b. Install yq for YAML merge (kislyuk/yq, jq wrapper)
                apt-get update -qq && apt-get install -y -qq jq >/dev/null
                pip install yq

                # 3. Install optax from source (required for Muon optimizer)
                pip uninstall optax -y 2>/dev/null || true
                pip install git+https://github.com/google-deepmind/optax

                # 4. Log persistence — only on Pod 0 (sync to GCS Fuse on exit)
                if [ "${JOB_COMPLETION_INDEX}" = "0" ]; then
                  source scripts/job_log_sync.sh "/models/pretrain/ling3/${RUN_NAME}"
                fi

                # 5. Run Ling3 training (unbuffered, pipefail for error capture)
                export PYTHONUNBUFFERED=1
                if [ -n "$LOG_FILE" ]; then
                  bash scripts/pretrain_ling3_tiny.sh 2>&1 | tee -a "$LOG_FILE"
                  exit "${PIPESTATUS[0]}"
                else
                  bash scripts/pretrain_ling3_tiny.sh
                fi
              env:
              # --- Dataset (DATASET_TYPE=grain for opensource, lazy for ant data) ---
              - name: DATASET_TYPE
                value: "${DATASET_TYPE}"
              - name: DATASETS_YAML
                value: "${DATASETS_YAML}"
              # Lazy loader scatter override (only used when DATASET_TYPE=lazy).
              # -1 = single-host debug (all shards on every process).
              # -4 = production (4 scatter groups, needs hosts multiple of 4).
              # WARNING: -1 and -4 produce DIFFERENT data consumption order.
              - name: LAZY_LOADER_SCATTER
                value: "${LAZY_LOADER_SCATTER}"
              # --- Training overrides (picked up by pretrain_ling3_tiny.sh) ---
              - name: STEPS
                value: "${STEPS}"
              - name: EVAL_INTERVAL
                value: "${EVAL_INTERVAL}"
              - name: ENABLE_CHECKPOINTING
                value: "false"
              # CHECKPOINT_PERIOD set high to avoid saving new checkpoints during repro
              - name: CHECKPOINT_PERIOD
                value: "10000"
              - name: GCS_BUCKET
                value: "gs://data_ant/pretrain/ling3"
              - name: RUN_NAME
                value: "${JOB_NAME}"
              # --- Optimizer (Muon with AdamW fallback) ---
              - name: OPT_TYPE
                value: "${OPT_TYPE}"
              # --- Parallelism (16 hosts × 8 devices = 128 devices) ---
              - name: ICI_EXPERT_PARALLELISM
                value: "${ICI_EXPERT_PARALLELISM}"
              - name: ICI_DATA_PARALLELISM
                value: "${ICI_DATA_PARALLELISM}"
              - name: ICI_FSDP_PARALLELISM
                value: "${ICI_FSDP_PARALLELISM}"
              - name: ICI_TENSOR_PARALLELISM
                value: "${ICI_TENSOR_PARALLELISM}"
              - name: ICI_CONTEXT_PARALLELISM
                value: "${ICI_CONTEXT_PARALLELISM}"
              - name: SHARD_EXP_ON_FSDP
                value: "${SHARD_EXP_ON_FSDP}"
              # --- Batch / accumulation ---
              - name: PER_DEVICE_BATCH_SIZE
                value: "${PER_DEVICE_BATCH_SIZE}"
              - name: GRADIENT_ACCUMULATION_STEPS
                value: "${GRADIENT_ACCUMULATION_STEPS}"
              - name: REMAT_POLICY
                value: "${REMAT_POLICY}"
              # --- Profiler ---
              - name: PROFILER
                value: "${PROFILER}"
              - name: SKIP_FIRST_N_STEPS_FOR_PROFILER
                value: "${SKIP_FIRST_N_STEPS_FOR_PROFILER}"
              - name: PROFILER_STEPS
                value: "${PROFILER_STEPS}"
              # --- Extra XLA flags ---
              - name: LIBTPU_INIT_ARGS
                value: "${LIBTPU_INIT_ARGS}"
              # --- Vertex AI TensorBoard ---
              - name: USE_VERTEX_TENSORBOARD
                value: "${USE_VERTEX_TENSORBOARD}"
              - name: VERTEX_TB_PROJECT
                value: "tpu-for-training"
              - name: VERTEX_TB_REGION
                value: "us-central1"
              # --- Disable Goodput in dev runs ---
              - name: ENABLE_GOODPUT
                value: "false"
              # --- GitHub token for cloning private repo ---
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: perf-64chips-token
                    key: token
              # --- Runtime env ---
              - name: PIP_CACHE_DIR
                value: /tmp/ramdisk/.cache/pip
              - name: PATH
                value: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              - name: TPU_PROCESS_ADDRESSES
                value: ${JOB_NAME}-worker-0-0.${JOB_NAME}:8476,${JOB_NAME}-worker-0-1.${JOB_NAME}:8476,${JOB_NAME}-worker-0-2.${JOB_NAME}:8476,${JOB_NAME}-worker-0-3.${JOB_NAME}:8476,${JOB_NAME}-worker-0-4.${JOB_NAME}:8476,${JOB_NAME}-worker-0-5.${JOB_NAME}:8476,${JOB_NAME}-worker-0-6.${JOB_NAME}:8476,${JOB_NAME}-worker-0-7.${JOB_NAME}:8476,${JOB_NAME}-worker-0-8.${JOB_NAME}:8476,${JOB_NAME}-worker-0-9.${JOB_NAME}:8476,${JOB_NAME}-worker-0-10.${JOB_NAME}:8476,${JOB_NAME}-worker-0-11.${JOB_NAME}:8476,${JOB_NAME}-worker-0-12.${JOB_NAME}:8476,${JOB_NAME}-worker-0-13.${JOB_NAME}:8476,${JOB_NAME}-worker-0-14.${JOB_NAME}:8476,${JOB_NAME}-worker-0-15.${JOB_NAME}:8476
              - name: TPU_PROCESS_PORT
                value: "8476"
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  ephemeral-storage: 20Gi
                  google.com/tpu: "4"
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /models
                name: gcs-fuse-csi-ephemeral
              - mountPath: /tmp/ramdisk
                name: tmpfs
              - mountPath: /dev/shm
                name: dshm
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 4x4x4
            restartPolicy: Never
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            terminationGracePeriodSeconds: 30
            volumes:
            - emptyDir:
                medium: Memory
                sizeLimit: 200Gi
              name: tmpfs
            - emptyDir:
                medium: Memory
              name: gke-gcsfuse-cache
            - name: gcs-fuse-csi-ephemeral
              persistentVolumeClaim:
                claimName: ant-data-pvc
            - name: dshm
              emptyDir:
                medium: Memory
