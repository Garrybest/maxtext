# TPU 64chips 1K Steps - K8s Manifests (JobSet)
# Global batch size = 5120
# This template is rendered by envsubst with: $JOB_NAME $BRANCH $BRANCH_LABEL $USER $USE_FP8_BLOCKWISE
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOB_NAME}
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
  labels:
    app: tpu-64chips-ling2-job
    repo-branch: "${BRANCH_LABEL}"
    owner: "${USER}"
spec:
  failurePolicy:
    maxRestarts: 3
    rules:
    - name: restart_on_failure
      action: RestartJobSet
      onJobFailureReasons:
      - BackoffLimitExceeded
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          app: tpu-64chips-ling2-job
          repo-branch: "${BRANCH_LABEL}"
          owner: "${USER}"
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 16
        parallelism: 16
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
            labels:
              app: tpu-64chips-ling2-job
              repo-branch: "${BRANCH_LABEL}"
              owner: "${USER}"
          spec:
            containers:
            - name: jax-tpu
              image: python:3.12
              imagePullPolicy: IfNotPresent
              command:
              - bash
              - -c
              - |
                set -exo pipefail

                # 0. Configure git credentials for private repos
                git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

                # 1. Clone branch
                git clone --depth=1 --branch="${BRANCH}" https://github.com/primatrix/maxtext.git /root/maxtext
                cd /root/maxtext

                # 2. Setup Python environment
                pip install uv
                uv venv --python 3.12 --seed maxtext_venv
                source maxtext_venv/bin/activate
                uv pip install -e '.[tpu]' --resolution=lowest
                install_maxtext_tpu_github_deps

                # 3. Install optax from source
                pip uninstall optax -y 2>/dev/null || true
                pip install git+https://github.com/google-deepmind/optax

                # 4. Log persistence — only on Pod 0 (sync to GCS Fuse every 5min + on exit)
                if [ "${JOB_COMPLETION_INDEX}" = "0" ]; then
                  source scripts/job_log_sync.sh "/models/pretrain/ling2/${RUN_NAME}"
                fi

                # 5. Run 1000-step training (STEPS/WARMUP_ITERS/EVAL_INTERVAL set via env)
                FP8_ARGS=""
                if [ "${USE_FP8_BLOCKWISE:-}" = "true" ]; then
                  FP8_ARGS="quantization=fp8_blockwise use_qwix_quantization=true fp8_format=e4m3 use_tokamax_gmm=true"
                fi
                if [ -n "$LOG_FILE" ]; then
                  bash scripts/pretrain_ling2.sh $FP8_ARGS 2>&1 | tee -a "$LOG_FILE"
                else
                  bash scripts/pretrain_ling2.sh $FP8_ARGS
                fi
              env:
              # --- CI overrides (picked up by pretrain_ling2.sh) ---
              - name: STEPS
                value: "1000"
              - name: EVAL_INTERVAL
                value: "2000"
              - name: GRADIENT_ACCUMULATION_STEPS
                value: "20"
              - name: GCS_BUCKET
                value: "gs://data_ant/pretrain/ling2"
              - name: RUN_NAME
                value: "${JOB_NAME}"
              # --- FP8 blockwise quantization (set to "true" to enable) ---
              - name: USE_FP8_BLOCKWISE
                value: "${USE_FP8_BLOCKWISE}"
              # --- Vertex AI TensorBoard ---
              - name: USE_VERTEX_TENSORBOARD
                value: "true"
              - name: VERTEX_TB_PROJECT
                value: "tpu-for-training"
              - name: VERTEX_TB_REGION
                value: "us-central1"
              # --- Parallelism: EP=8, DP=16 for 128 devices (64 chips x 2) ---
              - name: ICI_EXPERT_PARALLELISM
                value: "8"
              - name: ICI_DATA_PARALLELISM
                value: "16"
              # --- GitHub token for cloning private repo ---
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: perf-64chips-token
                    key: token
              # --- Runtime env (matching job_single.yaml) ---
              - name: PIP_CACHE_DIR
                value: /tmp/ramdisk/.cache/pip
              - name: PATH
                value: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              - name: TPU_PROCESS_ADDRESSES
                value: ${JOB_NAME}-worker-0-0.${JOB_NAME}:8476,${JOB_NAME}-worker-0-1.${JOB_NAME}:8476,${JOB_NAME}-worker-0-2.${JOB_NAME}:8476,${JOB_NAME}-worker-0-3.${JOB_NAME}:8476,${JOB_NAME}-worker-0-4.${JOB_NAME}:8476,${JOB_NAME}-worker-0-5.${JOB_NAME}:8476,${JOB_NAME}-worker-0-6.${JOB_NAME}:8476,${JOB_NAME}-worker-0-7.${JOB_NAME}:8476,${JOB_NAME}-worker-0-8.${JOB_NAME}:8476,${JOB_NAME}-worker-0-9.${JOB_NAME}:8476,${JOB_NAME}-worker-0-10.${JOB_NAME}:8476,${JOB_NAME}-worker-0-11.${JOB_NAME}:8476,${JOB_NAME}-worker-0-12.${JOB_NAME}:8476,${JOB_NAME}-worker-0-13.${JOB_NAME}:8476,${JOB_NAME}-worker-0-14.${JOB_NAME}:8476,${JOB_NAME}-worker-0-15.${JOB_NAME}:8476
              - name: TPU_PROCESS_PORT
                value: "8476"
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  ephemeral-storage: 20Gi
                  google.com/tpu: "4"
              securityContext:
                privileged: true  # Required for TPU device access on GKE
              volumeMounts:
              - mountPath: /models
                name: gcs-fuse-csi-ephemeral
              - mountPath: /tmp/ramdisk
                name: tmpfs
              - mountPath: /dev/shm
                name: dshm
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 4x4x4
            restartPolicy: Never
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            terminationGracePeriodSeconds: 30
            volumes:
            - emptyDir:
                medium: Memory
                sizeLimit: 200Gi
              name: tmpfs
            - emptyDir:
                medium: Memory
              name: gke-gcsfuse-cache
            - name: gcs-fuse-csi-ephemeral
              persistentVolumeClaim:
                claimName: ant-data-pvc
            - name: dshm
              emptyDir:
                medium: Memory
