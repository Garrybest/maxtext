# CI TPU Smoke Test - K8s Manifests
# This template is rendered by envsubst with: $JOB_NAME $BRANCH $PR_NUMBER $BRANCH_LABEL
# Runs a minimal MaxText training for 10 steps with synthetic data.
---
# Headless Service for TPU pod DNS resolution (required for JAX coordinator)
apiVersion: v1
kind: Service
metadata:
  name: ${JOB_NAME}-headless-svc
  namespace: default
  labels:
    app: ci-smoke-test
    ci-branch: "${BRANCH_LABEL}"
    ci-pr: "${PR_NUMBER}"
spec:
  clusterIP: None
  selector:
    job-name: ${JOB_NAME}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    app: ci-smoke-test
    ci-branch: "${BRANCH_LABEL}"
    ci-pr: "${PR_NUMBER}"
    job-name: ${JOB_NAME}
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
      labels:
        app: ci-smoke-test
        ci-branch: "${BRANCH_LABEL}"
        ci-pr: "${PR_NUMBER}"
        job-name: ${JOB_NAME}
    spec:
      containers:
      - name: jax-tpu
        image: python:3.12
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -ex

          # 1. Clone PR branch
          git clone --depth=1 --branch="${BRANCH}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/primatrix/maxtext.git" \
            /root/maxtext
          cd /root/maxtext

          # 2. Setup Python environment
          pip install uv
          uv venv --python 3.12 --seed maxtext_venv
          source maxtext_venv/bin/activate
          uv pip install -e '.[tpu]' --resolution=lowest

          # 3. Run smoke test (10-step training with synthetic data)
          bash scripts/ci_smoke_test.sh
        env:
        # --- CI overrides ---
        - name: STEPS
          value: "10"
        - name: RUN_NAME
          value: "${JOB_NAME}"
        # --- GitHub token for cloning private repo ---
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${JOB_NAME}-token
              key: token
        # --- Runtime env ---
        - name: PIP_CACHE_DIR
          value: /tmp/ramdisk/.cache/pip
        - name: PATH
          value: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: TPU_PROCESS_ADDRESSES
          value: ${JOB_NAME}-0.${JOB_NAME}-headless-svc:8476
        - name: TPU_PROCESS_PORT
          value: "8476"
        resources:
          limits:
            google.com/tpu: "4"
          requests:
            ephemeral-storage: 20Gi
            google.com/tpu: "4"
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /models
          name: gcs-fuse-csi-ephemeral
        - mountPath: /tmp/ramdisk
          name: tmpfs
        - mountPath: /dev/shm
          name: dshm
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      restartPolicy: Never
      serviceAccountName: gcs-account
      subdomain: ${JOB_NAME}-headless-svc
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 200Gi
        name: tmpfs
      - emptyDir:
          medium: Memory
        name: gke-gcsfuse-cache
      - name: gcs-fuse-csi-ephemeral
        persistentVolumeClaim:
          claimName: ant-pretrain-pvc
      - name: dshm
        emptyDir:
          medium: Memory
