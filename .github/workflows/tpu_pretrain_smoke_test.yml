name: TPU Pretrain Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      target_cluster:
        description: "Cluster target (default = repo secrets, lingbo = pre-cutover validation)"
        required: false
        type: choice
        default: default
        options: [default, lingbo]

concurrency:
  group: ci-tpu-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  USE_TPU_POOL: 'true'

jobs:
  tpu_smoke_test:
    name: "10-step pretrain smoke test on TPU"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Resolve test target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "checkout_ref=$GITHUB_SHA_VALUE" >> "$GITHUB_OUTPUT"
            echo "pod_ref=$GITHUB_REF_VALUE" >> "$GITHUB_OUTPUT"
            echo "expected_sha=$GITHUB_SHA_VALUE" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$GITHUB_SHA_VALUE" >> "$GITHUB_OUTPUT"
            echo "pod_ref=$GITHUB_REF_VALUE" >> "$GITHUB_OUTPUT"
            echo "expected_sha=$GITHUB_SHA_VALUE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}

      - name: Verify *_LINGBO secrets are populated
        if: inputs.target_cluster == 'lingbo'
        env:
          WIF_LINGBO: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO }}
          SA_LINGBO: ${{ secrets.GCP_SERVICE_ACCOUNT_LINGBO }}
          CLUSTER_LINGBO: ${{ secrets.GKE_CLUSTER_LINGBO }}
          LOCATION_LINGBO: ${{ secrets.GKE_LOCATION_LINGBO }}
        run: |
          missing=()
          [ -z "$WIF_LINGBO" ] && missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO)
          [ -z "$SA_LINGBO" ] && missing+=(GCP_SERVICE_ACCOUNT_LINGBO)
          [ -z "$CLUSTER_LINGBO" ] && missing+=(GKE_CLUSTER_LINGBO)
          [ -z "$LOCATION_LINGBO" ] && missing+=(GKE_LOCATION_LINGBO)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::target_cluster=lingbo but these secrets are empty: ${missing[*]} - refusing to silently fall back to the default cluster."
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.target_cluster == 'lingbo' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.target_cluster == 'lingbo' && secrets.GCP_SERVICE_ACCOUNT_LINGBO || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.target_cluster == 'lingbo' && secrets.GKE_CLUSTER_LINGBO || secrets.GKE_CLUSTER }}
          location: ${{ inputs.target_cluster == 'lingbo' && secrets.GKE_LOCATION_LINGBO || secrets.GKE_LOCATION }}

      - name: Generate unique job name
        id: job
        run: |
          JOB_NAME="ci-smoke-${GITHUB_RUN_NUMBER}"
          JOB_NAME=$(echo "$JOB_NAME" | tr '[:upper:]' '[:lower:]' | head -c 63)
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      # ── TPU Pool path ──────────────────────────────────────
      - name: Acquire TPU pod
        if: env.USE_TPU_POOL == 'true'
        id: acquire
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          TASK_TYPE: smoke-test
        run: |
          source .github/ci/acquire-tpu-pod.sh
          echo "pod=$POD" >> "$GITHUB_OUTPUT"

      - name: "Run: clean + clone + install + smoke test"
        if: env.USE_TPU_POOL == 'true'
        env:
          POD: ${{ steps.acquire.outputs.pod }}
          TARGET_REF: ${{ steps.target.outputs.pod_ref }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          TOKEN: ${{ github.token }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: |
          set -euo pipefail

          # Clean previous workspace and venv
          kubectl exec "$POD" -- find /workspace /opt/ci-env -mindepth 1 -delete

          # Fetch the exact workflow target using an immutable ref when available.
          echo "$TOKEN" | kubectl exec -i "$POD" -- bash -c '
            read -r GITHUB_TOKEN
            git init /workspace/maxtext
            cd /workspace/maxtext
            git remote add origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/primatrix/maxtext.git"
            git fetch --depth=1 origin "'"$TARGET_REF"'"
            git checkout --detach FETCH_HEAD

            ACTUAL_SHA=$(git rev-parse HEAD)
            EXPECTED_SHA="'"$EXPECTED_SHA"'"
            if [ -n "${EXPECTED_SHA}" ] && [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "ERROR: checked out ${ACTUAL_SHA}, expected ${EXPECTED_SHA}" >&2
              exit 1
            fi
          '

          # Fresh venv + full install
          # Token is piped via stdin so uv can fetch private primatrix/* git deps
          # (e.g. pallas-kernel). GIT_CONFIG_GLOBAL scopes the rewrite to this
          # shell and the trap deletes it on exit so the token does not persist
          # in /root/.gitconfig across jobs on the shared pool pod.
          echo "$CROSS_REPO_TOKEN" | kubectl exec -i "$POD" -- bash -c '
            read -r CROSS_REPO_TOKEN
            export GIT_CONFIG_GLOBAL=/tmp/git-config-install
            trap "rm -f $GIT_CONFIG_GLOBAL" EXIT
            git config --global \
              url."https://x-access-token:${CROSS_REPO_TOKEN}@github.com/primatrix/".insteadOf \
              "https://github.com/primatrix/"

            cd /workspace/maxtext
            /opt/tools/uv venv --python 3.12 --seed /opt/ci-env
            . /opt/ci-env/bin/activate
            /opt/tools/uv pip install -e ".[tpu]" --resolution=lowest
          '

          # Run smoke test with timeout
          kubectl exec "$POD" -- timeout 3600 bash -c '
            . /opt/ci-env/bin/activate
            cd /workspace/maxtext
            export USE_FP8_BLOCKWISE=true
            bash scripts/ci_smoke_test.sh
          '

      - name: Release TPU pod
        if: always() && env.USE_TPU_POOL == 'true' && steps.acquire.outputs.pod != ''
        env:
          POD: ${{ steps.acquire.outputs.pod }}
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: source .github/ci/release-tpu-pod.sh

      # ── Fallback: legacy Job path (USE_TPU_POOL=false) ────
      - name: Sanitize branch name for K8s label
        if: env.USE_TPU_POOL != 'true'
        id: branch
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          LABEL=$(echo "$RAW" | sed 's/[^a-zA-Z0-9._-]/-/g' | head -c 63 | sed 's/^[^a-zA-Z0-9]//;s/[^a-zA-Z0-9]$//')
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Cleanup previous CI resources
        if: env.USE_TPU_POOL != 'true'
        run: |
          BRANCH_LABEL="${{ steps.branch.outputs.label }}"
          echo "Cleaning up leftover CI resources for branch=$BRANCH_LABEL..."
          kubectl delete jobs -l "app=ci-smoke-test,ci-branch=$BRANCH_LABEL" --ignore-not-found
          kubectl delete services -l "app=ci-smoke-test,ci-branch=$BRANCH_LABEL" --ignore-not-found
          kubectl delete secrets -l "app=ci-smoke-test,ci-branch=$BRANCH_LABEL" --ignore-not-found

      - name: Create GitHub token secret
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl create secret generic "${JOB_NAME}-token" \
            --from-literal=token="${{ github.token }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret "${JOB_NAME}-token" \
            app=ci-smoke-test \
            ci-branch="${{ steps.branch.outputs.label }}" \
            --overwrite

      - name: Deploy K8s Job
        if: env.USE_TPU_POOL != 'true'
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          BRANCH: ${{ steps.target.outputs.pod_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_LABEL: ${{ steps.branch.outputs.label }}
        run: |
          envsubst '$JOB_NAME $BRANCH $PR_NUMBER $BRANCH_LABEL' \
            < .github/ci/tpu-smoke-test-job.yaml \
            | kubectl apply -f -

      - name: Wait for pod to start
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          echo "Waiting for pod of job/$JOB_NAME to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl get pods -l "job-name=$JOB_NAME" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              PHASE=$(kubectl get pod "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || true)
              echo "  Pod $POD phase: $PHASE"
              if [ "$PHASE" = "Running" ] || [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
                break
              fi
            fi
            echo "  Waiting for pod to be scheduled... ($i/60)"
            sleep 10
          done

      - name: Stream logs & wait for completion
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl logs -f "job/$JOB_NAME" -c jax-tpu || true
          if kubectl wait --for=condition=complete --timeout=60s "job/$JOB_NAME" 2>/dev/null; then
            echo "Job completed successfully!"
            exit 0
          fi
          if kubectl wait --for=condition=failed --timeout=60s "job/$JOB_NAME" 2>/dev/null; then
            echo "Job failed!"
            exit 1
          fi
          echo "Job in unexpected state:"
          kubectl get "job/$JOB_NAME" -o wide
          exit 1

      - name: Cleanup legacy resources
        if: always() && env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl delete job "$JOB_NAME" --ignore-not-found
          kubectl delete service "${JOB_NAME}-headless-svc" --ignore-not-found
          kubectl delete secret "${JOB_NAME}-token" --ignore-not-found
