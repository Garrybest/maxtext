name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "main"
      dump_dir:
        description: "Megatron dump directory on GCS-Fuse (leave empty to auto-detect)"
        required: false
        default: ""
      ckpt_path:
        description: "Orbax checkpoint path"
        required: false
        default: "/models/gpu-ckpt-ling2.5/AL_MODEL_HF20E256_ORBAX_MTP/0/items/"

concurrency:
  group: ci-tpu-ut-${{ github.head_ref || github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

env:
  USE_TPU_POOL: 'true'

jobs:
  unit_tests:
    name: "Unit tests on TPU"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref_name }}

      - name: Resolve dump directory
        id: dump
        run: |
          INPUT_DIR="${{ github.event.inputs.dump_dir }}"
          if [ -n "$INPUT_DIR" ]; then
            echo "Using user-specified dump dir: $INPUT_DIR"
            echo "dir=$INPUT_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "Dump dir not specified; K8s pod will auto-detect from GCS-Fuse mount."
            echo "dir=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Generate unique job name
        id: job
        run: |
          BRANCH="${{ github.event.inputs.branch || github.head_ref || github.ref_name }}"
          JOB_NAME="ci-ut-$(echo "$BRANCH" | tr '/_' '--' | tr '[:upper:]' '[:lower:]' | head -c 30)-${GITHUB_RUN_NUMBER}"
          JOB_NAME=$(echo "$JOB_NAME" | head -c 63)
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      # ── TPU Pool path ──────────────────────────────────────
      - name: Acquire TPU pod
        if: env.USE_TPU_POOL == 'true'
        id: acquire
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          TASK_TYPE: unit-tests
        run: |
          source .github/ci/acquire-tpu-pod.sh
          echo "pod=$POD" >> "$GITHUB_OUTPUT"

      - name: "Run: clean + clone + install + unit tests"
        if: env.USE_TPU_POOL == 'true'
        env:
          POD: ${{ steps.acquire.outputs.pod }}
          BRANCH: ${{ github.event.inputs.branch || github.head_ref || github.ref_name }}
          TOKEN: ${{ github.token }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          JOB_NAME: ${{ steps.job.outputs.name }}
          DUMP_DIR: ${{ steps.dump.outputs.dir }}
          CKPT_PATH: ${{ github.event.inputs.ckpt_path || '/models/gpu-ckpt-ling2.5/AL_MODEL_HF20E256_ORBAX_MTP/0/items/' }}
        run: |
          set -euo pipefail

          # Clean previous workspace, venv, and ramdisk data
          kubectl exec "$POD" -- find /workspace /opt/ci-env /tmp/ramdisk -mindepth 1 -delete

          # 1. Clone code using per-run ephemeral token via stdin
          echo "$TOKEN" | kubectl exec -i "$POD" -- bash -c '
            read -r GITHUB_TOKEN
            git clone --depth=1 --branch="'"$BRANCH"'" \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/primatrix/maxtext.git" \
              /workspace/maxtext
          '

          # Clone Argus using cross-repo token
          echo "$CROSS_REPO_TOKEN" | kubectl exec -i "$POD" -- bash -c '
            read -r CROSS_REPO_TOKEN
            git clone --depth=1 \
              "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/primatrix/Argus.git" \
              /workspace/Argus
          '

          # 2. Fresh venv + full install (includes test deps + Argus + gcloud)
          kubectl exec "$POD" -- bash -c '
            cd /workspace/maxtext
            /opt/tools/uv venv --python 3.12 --seed /opt/ci-env
            . /opt/ci-env/bin/activate
            /opt/tools/uv pip install -e ".[tpu]" --resolution=lowest
            /opt/tools/uv pip install pytest pytest-timeout
            pip install -e /workspace/Argus

            # Install gcloud CLI for fast GCS downloads (bypasses GCS-Fuse)
            curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt 2>&1 | tail -1
          '

          # 3. Resolve dump dir + pre-copy to ramdisk + run tests
          kubectl exec "$POD" -- timeout 3600 bash -c '
            . /opt/ci-env/bin/activate
            cd /workspace/maxtext
            export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/src
            export PATH="/opt/google-cloud-sdk/bin:${PATH}"
            export TMPDIR=/tmp/ramdisk

            # --- Resolve dump directory (auto-detect from GCS-Fuse if not specified) ---
            is_dump_complete() {
              local d="$1"
              local step_dir=$(ls -d "${d}"/step_* 2>/dev/null | head -1)
              if [ -z "${step_dir}" ]; then
                echo "  INCOMPLETE: no step_* dirs in ${d}" >&2
                return 1
              fi
              local rank_dir=$(ls -d "${step_dir}"/rank_* 2>/dev/null | head -1)
              if [ -z "${rank_dir}" ]; then
                echo "  INCOMPLETE: no rank_* dirs in ${step_dir}" >&2
                return 1
              fi
              if [ ! -f "${rank_dir}/forward/index.json" ]; then
                echo "  INCOMPLETE: no forward/index.json in ${rank_dir}" >&2
                return 1
              fi
              echo "  COMPLETE: ${d}" >&2
              return 0
            }

            find_valid_dump() {
              local candidates="$1"
              for d in $(echo "${candidates}" | sort -r); do
                [ -z "${d}" ] && continue
                if is_dump_complete "${d}"; then
                  echo "${d}"
                  return 0
                fi
              done
              return 1
            }

            RESOLVED_DUMP_DIR="'"$DUMP_DIR"'"
            if [ "${RESOLVED_DUMP_DIR}" = "auto" ] || [ -z "${RESOLVED_DUMP_DIR}" ]; then
              echo "Auto-detecting megatron_ci dump from /models/argus_dump/..."
              CANDIDATES=$(ls -d /models/argus_dump/megatron_ci_* 2>/dev/null \
                | grep -E "/megatron_ci_[0-9]{8}_[0-9]{6}_[0-9a-f]+$")
              RESOLVED_DUMP_DIR=$(find_valid_dump "${CANDIDATES}") || true
              if [ -z "${RESOLVED_DUMP_DIR}" ]; then
                echo "ERROR: No complete megatron_ci dump found in /models/argus_dump/"
                echo "  All candidates checked:"
                echo "${CANDIDATES}" | sed "s/^/    /"
                exit 1
              fi
            fi

            # --- Pre-copy test data from GCS to ramdisk for faster I/O ---
            RAMDISK="/tmp/ramdisk"
            RAMDISK_DUMP="${RAMDISK}/dump"
            RAMDISK_CKPT="${RAMDISK}/ckpt"
            ACTIVE_CKPT="'"$CKPT_PATH"'"

            FUSE_MOUNT="/models"
            GCS_BUCKET=$(awk -v mp="${FUSE_MOUNT}" '"'"'$2 == mp {print $1}'"'"' /proc/mounts)
            if [ -z "${GCS_BUCKET}" ]; then
              echo "WARNING: Cannot detect GCS bucket from ${FUSE_MOUNT} mount, falling back to cp"
              USE_GCLOUD=false
            else
              echo "Detected GCS bucket: ${GCS_BUCKET} (mounted at ${FUSE_MOUNT})"
              USE_GCLOUD=true
            fi

            fuse_to_gcs() {
              echo "gs://${GCS_BUCKET}/${1#${FUSE_MOUNT}/}"
            }

            echo ""
            echo "========================================================"
            echo "Pre-copying test data to ramdisk (via $(${USE_GCLOUD} && echo gcloud || echo cp))"
            echo "  dump-dir: ${RESOLVED_DUMP_DIR}"
            echo "  ckpt-path: ${ACTIVE_CKPT}"
            echo "========================================================"

            COPY_START=$(date +%s)

            STEP1_DIR="${RESOLVED_DUMP_DIR}/step_1"
            if [ ! -d "${STEP1_DIR}" ]; then
              echo "ERROR: ${STEP1_DIR} not found"
              exit 1
            fi
            for rank_dir in "${STEP1_DIR}"/rank_*; do
              rank_name=$(basename "${rank_dir}")
              dest="${RAMDISK_DUMP}/step_1/${rank_name}"
              mkdir -p "${dest}"
              (
                cp "${rank_dir}/metadata.yaml" "${dest}/" 2>/dev/null || true
                for cat_dir in "${rank_dir}"/*/; do
                  cat_name=$(basename "${cat_dir}")
                  case "${cat_name}" in
                    forward|backward|grads)
                      mkdir -p "${dest}/${cat_name}"
                      if ${USE_GCLOUD}; then
                        gcs_src="$(fuse_to_gcs "${cat_dir}")"
                        if ! gcloud storage cp -r "${gcs_src}*" "${dest}/${cat_name}/" 2>&1; then
                          echo "WARNING: gcloud cp failed for ${gcs_src}, falling back to cp" >&2
                          cp -a "${cat_dir}"/. "${dest}/${cat_name}/"
                        fi
                      else
                        cp -a "${cat_dir}"/. "${dest}/${cat_name}/"
                      fi
                      ;;
                    *)
                      ln -s "${cat_dir}" "${dest}/${cat_name}"
                      ;;
                  esac
                done
              ) &
            done

            for step_dir in "${RESOLVED_DUMP_DIR}"/step_*; do
              step_name=$(basename "${step_dir}")
              [ "${step_name}" = "step_1" ] && continue
              ln -s "${step_dir}" "${RAMDISK_DUMP}/${step_name}"
            done

            (
              if ${USE_GCLOUD}; then
                gcs_ckpt="$(fuse_to_gcs "${ACTIVE_CKPT}")"
                mkdir -p "${RAMDISK_CKPT}"
                if ! gcloud storage cp -r "${gcs_ckpt}*" "${RAMDISK_CKPT}/" 2>&1; then
                  echo "WARNING: gcloud cp failed for ${gcs_ckpt}, falling back to cp" >&2
                  cp -a "${ACTIVE_CKPT}"/. "${RAMDISK_CKPT}/"
                fi
              else
                cp -a "${ACTIVE_CKPT}"/. "${RAMDISK_CKPT}/"
              fi
            ) &

            wait
            COPY_EXIT=$?
            COPY_END=$(date +%s)
            echo "  Ramdisk copy done in $((COPY_END - COPY_START))s (exit=${COPY_EXIT})"
            echo "  Copied sizes: dump=$(du -sh "${RAMDISK_DUMP}" | awk '"'"'{print $1}'"'"'), ckpt=$(du -sh "${RAMDISK_CKPT}" | awk '"'"'{print $1}'"'"')"
            echo "  Ramdisk usage: $(df -h "${RAMDISK}" | tail -1 | awk '"'"'{print $3 "/" $2 " (" $5 " used)"}'"'"')"

            RESOLVED_DUMP_DIR="${RAMDISK_DUMP}"
            ACTIVE_CKPT="${RAMDISK_CKPT}"

            # --- Run unit tests ---
            export DUMP_DIR="${RESOLVED_DUMP_DIR}"
            export CKPT_PATH="${ACTIVE_CKPT}"
            echo ""
            echo "========================================================"
            echo "Running unit tests"
            echo "  dump-dir: ${RESOLVED_DUMP_DIR}"
            echo "  ckpt-path: ${ACTIVE_CKPT}"
            echo "========================================================"

            UNIT_TEST_EXIT=0
            python3 -m pytest tests/unit/ -v -x --timeout=600 \
              --ignore=tests/unit/test_env_smoke.py \
              --ignore=tests/unit/maxengine_test.py \
              --ignore=tests/unit/attention_test.py \
              --ignore=tests/unit/context_parallelism_test.py \
              --ignore=tests/unit/grain_data_processing_test.py \
              --ignore=tests/unit/hf_data_processing_test.py \
              --ignore=tests/unit/mhc_test.py \
              --ignore=tests/unit/moe_test.py \
              --ignore=tests/unit/multihost_dataloading_test.py \
              --ignore=tests/unit/pipeline_parallelism_test.py \
              --ignore=tests/unit/tfds_data_processing_test.py \
              --ignore=tests/unit/tokenizer_test.py \
              --ignore=tests/unit/gla_compare_test.py \
              -k "not scheduled_only" \
              2>&1 || UNIT_TEST_EXIT=$?

            # Always run the env smoke test (should always pass)
            ENV_SMOKE_EXIT=0
            python3 -m pytest tests/unit/test_env_smoke.py -v || ENV_SMOKE_EXIT=$?

            # GLA compare test (Megatron dump precision comparison)
            GLA_EXIT=0
            echo ""
            echo "========================================================"
            echo "Running GLA compare test"
            echo "========================================================"
            python3 tests/unit/gla_compare_test.py -v || GLA_EXIT=$?

            [ "$UNIT_TEST_EXIT" -eq 0 ] && [ "$ENV_SMOKE_EXIT" -eq 0 ] && [ "$GLA_EXIT" -eq 0 ]
          '

      - name: Release TPU pod
        if: always() && env.USE_TPU_POOL == 'true' && steps.acquire.outputs.pod != ''
        env:
          POD: ${{ steps.acquire.outputs.pod }}
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: source .github/ci/release-tpu-pod.sh

      # ── Fallback: legacy Job path (USE_TPU_POOL=false) ────
      - name: Sanitize branch name for K8s label
        if: env.USE_TPU_POOL != 'true'
        id: branch
        run: |
          RAW="${{ github.event.inputs.branch || github.head_ref || github.ref_name }}"
          LABEL=$(echo "$RAW" | sed 's/[^a-zA-Z0-9._-]/-/g' | head -c 63 | sed 's/^[^a-zA-Z0-9]//;s/[^a-zA-Z0-9]$//')
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Cleanup previous CI resources
        if: env.USE_TPU_POOL != 'true'
        run: |
          BRANCH_LABEL="${{ steps.branch.outputs.label }}"
          echo "Cleaning up leftover CI resources for branch=$BRANCH_LABEL..."
          kubectl delete jobs -l "app=ci-unit-tests,ci-branch=$BRANCH_LABEL" --ignore-not-found
          kubectl delete services -l "app=ci-unit-tests,ci-branch=$BRANCH_LABEL" --ignore-not-found
          kubectl delete secrets -l "app=ci-unit-tests,ci-branch=$BRANCH_LABEL" --ignore-not-found

      - name: Create GitHub token secret
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl create secret generic "${JOB_NAME}-token" \
            --from-literal=token="${{ github.token }}" \
            --from-literal=cross-repo-token="${{ secrets.CROSS_REPO_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret "${JOB_NAME}-token" \
            app=ci-unit-tests \
            ci-branch="${{ steps.branch.outputs.label }}" \
            --overwrite

      - name: Deploy K8s Job
        if: env.USE_TPU_POOL != 'true'
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          BRANCH: ${{ github.event.inputs.branch || github.head_ref || github.ref_name }}
          DUMP_DIR: ${{ steps.dump.outputs.dir }}
          CKPT_PATH: ${{ github.event.inputs.ckpt_path || '/models/gpu-ckpt-ling2.5/AL_MODEL_HF20E256_ORBAX_MTP/0/items/' }}
          BRANCH_LABEL: ${{ steps.branch.outputs.label }}
        run: |
          envsubst '$JOB_NAME $BRANCH $DUMP_DIR $CKPT_PATH $BRANCH_LABEL' \
            < .github/ci/unit-tests-job.yaml \
            | kubectl apply -f -

      - name: Wait for pod to start
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          echo "Waiting for pod of job/$JOB_NAME to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl get pods -l "job-name=$JOB_NAME" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              PHASE=$(kubectl get pod "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || true)
              echo "  Pod $POD phase: $PHASE"
              if [ "$PHASE" = "Running" ] || [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
                break
              fi
            fi
            echo "  Waiting for pod to be scheduled... ($i/60)"
            sleep 10
          done

      - name: Stream logs & wait for completion
        if: env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl logs -f "job/$JOB_NAME" -c jax-tpu || true
          echo "Waiting for job completion status..."
          if kubectl wait --for=condition=complete --timeout=600s "job/$JOB_NAME" 2>/dev/null; then
            echo "Unit tests completed successfully!"
            exit 0
          fi
          if kubectl wait --for=condition=failed --timeout=30s "job/$JOB_NAME" 2>/dev/null; then
            echo "Unit tests failed!"
            exit 1
          fi
          echo "Job in unexpected state:"
          kubectl get "job/$JOB_NAME" -o wide
          exit 1

      - name: Cleanup legacy resources
        if: always() && env.USE_TPU_POOL != 'true'
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl delete job "$JOB_NAME" --ignore-not-found
          kubectl delete service "${JOB_NAME}-headless-svc" --ignore-not-found
          kubectl delete secret "${JOB_NAME}-token" --ignore-not-found
