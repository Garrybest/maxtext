name: TPU Loss Validation (16 chips, 100 steps, pool)

# Loss-validation runs on a long-lived 16-chip "shell pool" (4 v7x pods, 2x2x4
# topology) on tpu7x-cluster, claimed via a coordination.k8s.io/v1 Lease and
# driven by short kubectl-exec calls + per-pod /tmp/ramdisk/runs/$RUN_ID/
# status files. Replaces the per-run Job/Service/Secret pattern. See pool yaml
# at .github/ci/tpu-lossval16-pool.yaml for the StatefulSet definition.
#
# Failure detection: the Poll step checks every 30s that (a) all 4 pool pods
# remain Ready, (b) the Lease holder is still us, (c) no pod's exit_code is
# non-zero. First violation → exit failure → if-always Release cleanly tears
# down the trainer process groups (SIGTERM-then-SIGKILL) so JAX releases the
# TPU /dev/vfio/* IOMMU group cleanly for the next run.

on:
  schedule:
    # Every 2.5 hours. Single run takes ~115min, leaving ~35min buffer
    # before next cron — enough to absorb step-time drift without queue
    # backup. Cron can't express 2.5h uniformly (24h / 2.5h = 9.6), so
    # two cron lines: 5 fires per line × 2 lines = 10 fires/day. Most
    # gaps are 2.5h; one wrap-around gap (22:30 -> 00:00) is 1.5h.
    # PR review may revert this to nightly ("0 17 * * *") once the path
    # is validated for a few cycles.
    - cron: "0 0,5,10,15,20 * * *"
    - cron: "30 2,7,12,17,22 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run on (defaults to main)"
        required: false
        type: string

concurrency:
  group: tpu-loss-validation-16chips-pool
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tpu_loss_validation:
    name: "100-step loss validation on 16 TPU chips (pool, gbs=5120)"
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 30min acquire wait + ~110min train + ~3min gate + buffer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Default 3600s expires mid-run for ~110min runs; bump to 7200s
          # (max without org-policy allowlist) so a single token covers the
          # whole run. If the SA is NOT on the
          # constraints/iam.allowServiceAccountCredentialLifetimeExtension
          # allowlist, this step will hard-fail with INVALID_ARGUMENT — fall
          # back to in-loop refresh in that case.
          access_token_lifetime: 7200s

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Generate JOB_NAME
        id: job
        run: |
          JOB_NAME="lossval16-pool-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Acquire pool
        id: acquire
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: |
          # acquire script: idempotent kubectl apply pool yaml, wait Ready,
          # defensive cleanup, atomic Lease claim. Exports RUN_ID via
          # $GITHUB_OUTPUT.
          source .github/ci/acquire-lossval16-pool.sh

      - name: Stage run.env + clone branch on all 4 pods
        env:
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
          BRANCH: ${{ inputs.branch || 'main' }}
          # CROSS_REPO_TOKEN scopes to multiple primatrix/* repos so the
          # in-pod `uv pip install -e '.[tpu]'` can resolve private deps
          # (tops @ git+primatrix/pallas-kernel, tokamax @ git+primatrix/tokamax).
          # Falls back to per-repo github.token for forks/repos without the secret.
          TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          POOL_PODS="ci-lossval16-pool-0 ci-lossval16-pool-1 ci-lossval16-pool-2 ci-lossval16-pool-3"
          RUN_NAME="ci-lossval16-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          # Build per-run env. RUN_ID_INSIDE_ENV check in run-loss-validation-16.sh
          # rejects stale env from a previous run.
          cat > /tmp/run.env <<EOF
          RUN_ID_INSIDE_ENV=$RUN_ID
          RUN_NAME=$RUN_NAME
          GITHUB_TOKEN=$TOKEN
          STEPS=100
          LEARNING_RATE_SCHEDULE_STEPS=1000
          WARMUP_ITERS=250
          EVAL_INTERVAL=200
          PER_DEVICE_BATCH_SIZE=5
          GRADIENT_ACCUMULATION_STEPS=32
          GCS_BUCKET=gs://ant-pretrain/pretrain/ci-loss-validation
          ICI_EXPERT_PARALLELISM=1
          ICI_DATA_PARALLELISM=4
          ICI_FSDP_PARALLELISM=8
          ICI_TENSOR_PARALLELISM=1
          ICI_CONTEXT_PARALLELISM=1
          SHARD_EXP_ON_FSDP=true
          REMAT_POLICY=custom
          USE_VERTEX_TENSORBOARD=false
          ENABLE_GOODPUT=false
          PIP_CACHE_DIR=/tmp/ramdisk/.cache/pip
          EOF

          # Stage atomically (.tmp + mv) and clone in parallel on all 4 pods.
          # Track PIDs so we surface per-pod failures (a bare `wait` returns
          # 0 regardless of child exit codes). Inner shell uses
          # `set -euo pipefail` and unpiped git output so transient git
          # failures don't get masked by a `| tail` discarding non-zero
          # exit. GIT_CONFIG_GLOBAL is scoped to a temp file (cleaned by
          # trap) so the token-bearing `insteadOf` rule does NOT persist
          # in /root/.gitconfig across runs on this pod.
          declare -a PIDS
          for pod in $POOL_PODS; do
            (
              set -euo pipefail
              kubectl cp /tmp/run.env "$pod:/tmp/ramdisk/runs/$RUN_ID/run.env.tmp" -c jax-tpu
              kubectl exec "$pod" -c jax-tpu -- mv "/tmp/ramdisk/runs/$RUN_ID/run.env.tmp" "/tmp/ramdisk/runs/$RUN_ID/run.env"
              echo "$TOKEN" | kubectl exec -i "$pod" -c jax-tpu -- bash -c '
                set -euo pipefail
                read -r TOKEN
                export GIT_CONFIG_GLOBAL=/tmp/git-config-clone
                trap "rm -f $GIT_CONFIG_GLOBAL" EXIT
                git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
                rm -rf /workspace/maxtext
                git init /workspace/maxtext >/dev/null
                cd /workspace/maxtext
                git remote add origin "https://github.com/primatrix/maxtext.git"
                git fetch --depth=1 origin "'"$BRANCH"'" >/dev/null
                git checkout --detach FETCH_HEAD >/dev/null
                git rev-parse --short HEAD
              '
            ) &
            PIDS+=("$!:$pod")
          done

          fail=0
          for entry in "${PIDS[@]}"; do
            pid="${entry%%:*}"
            pod_name="${entry#*:}"
            if ! wait "$pid"; then
              echo "::error::stage+clone failed on $pod_name"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "Stage + clone done on 4 pods"

      - name: Launch trainer detached on all 4 pods
        env:
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
        run: |
          set -euo pipefail
          # `setsid` puts the trainer in its own session/process group so the
          # subsequent kubectl-exec stream close (SIGHUP) doesn't kill it.
          # The script writes /tmp/ramdisk/runs/$RUN_ID/{pgid,log,exit_code,done}
          # which the next step polls.
          for i in 0 1 2 3; do
            pod=ci-lossval16-pool-$i
            kubectl exec "$pod" -c jax-tpu -- bash -c "
              setsid bash /workspace/maxtext/.github/ci/run-loss-validation-16.sh $RUN_ID < /dev/null > /dev/null 2>&1 &
              disown
            "
          done
          echo "Trainers launched on all 4 pods"

      - name: Poll status + heartbeat lease
        env:
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: |
          set -uo pipefail
          POOL_PODS="ci-lossval16-pool-0 ci-lossval16-pool-1 ci-lossval16-pool-2 ci-lossval16-pool-3"
          deadline=$(( $(date +%s) + 7800 ))   # 130min hard timeout (~110min train + buffer)
          last_step=-1
          # Polling cadence: 90s. For a 110min run this drops the kubectl call
          # count from ~2400 (30s polling) to ~800; combined with the labeled
          # `kubectl get pods` below (1 call vs 4), per-iter cost falls from
          # 11 calls to 5. Heartbeat at 90s is well within the 300s STALE_AFTER
          # window in acquire-lossval16-pool.sh.
          POLL_INTERVAL=90
          # Tolerate transient kubectl/API hiccups. `kubectl ... 2>/dev/null || true`
          # treats a network error as if the field were empty, which used to
          # cascade-fail healthy 60min+ runs on a single hiccup. Require N
          # consecutive observations (~270s) before bailing — still well below
          # the 5min Lease stale window.
          not_ready_count=0
          holder_mismatch_count=0
          RETRY_THRESHOLD=3
          # Token refresh: kubeconfig has a STATIC bearer token written by
          # google-github-actions/auth@v2 with default 3600s lifetime. After
          # 60min ALL kubectl calls 401 (validated by test_kubectl_auth_refresh.yml).
          # Force-refresh via `gcloud auth print-access-token` (which triggers
          # the WIF ADC chain: GHA OIDC -> STS exchange) and write the new
          # token back into kubeconfig. Refresh at iter 30 (~45min) and
          # iter 60 (~90min); each refresh extends validity by another 60min.
          KUBE_USER=$(kubectl config view -o jsonpath='{.contexts[?(@.name=="'"$(kubectl config current-context)"'")].context.user}')
          echo "kube_user=$KUBE_USER  POLL_INTERVAL=${POLL_INTERVAL}s  RETRY_THRESHOLD=$RETRY_THRESHOLD"
          iter=0

          while true; do
            iter=$((iter + 1))
            now=$(date +%s)
            if [ $now -ge $deadline ]; then
              echo "::error::run timeout 130min reached"
              exit 1
            fi

            # Token refresh at iter 30 (~45min) and iter 60 (~90min).
            if [ $iter -eq 30 ] || [ $iter -eq 60 ]; then
              # Force gcloud to mint a fresh STS token by nuking its sqlite
              # cache before print-access-token. Without this, gcloud returns
              # the cached token if still within TTL — we'd write the same
              # value back to kubeconfig and get no actual rotation. Verified
              # empirically: with cache, T1==T2 (sha256 identical); after
              # nuke, T3 differs from T1. Belt-and-suspenders behind the
              # 7200s access_token_lifetime above (which alone should suffice
              # for ~110min runs, but this guards against silent ignore).
              rm -f "${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}/access_tokens.db" 2>/dev/null || true
              fresh_token=$(gcloud auth print-access-token 2>&1)
              if echo "$fresh_token" | grep -qiE "^ERROR|fail" || [ -z "$fresh_token" ]; then
                echo "[token-refresh] iter=$iter — gcloud auth print-access-token failed (cur token still valid for now): ${fresh_token:0:80}"
              elif kubectl config set-credentials "$KUBE_USER" --token="$fresh_token" >/dev/null 2>&1; then
                echo "[token-refresh] iter=$iter — kubeconfig token rotated (prefix=${fresh_token:0:20}...)"
              else
                echo "[token-refresh] iter=$iter — kubectl config set-credentials failed (cur token still valid for now)"
              fi
            fi

            # Lease heartbeat: prevents another workflow's stale-acquire path
            # from force-releasing us.
            kubectl patch lease ci-lossval16-pool-claim --type=merge -p \
              "{\"spec\":{\"renewTime\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)\"}}" >/dev/null 2>&1 || true

            # All-Ready check with retry tolerance. One labeled `kubectl get pods`
            # call returns all 4 pods' Ready status — 4x fewer kubectl
            # round-trips than per-pod fetches. Format:
            # "ci-lossval16-pool-0=True ci-lossval16-pool-1=True ..."
            ready_summary=$(kubectl get pods -l pool=ci-lossval16 \
              -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status} {end}' \
              2>/dev/null || true)
            # Trailing `|| true`: when ready_summary is empty (kubectl errored),
            # `grep -o '=True'` finds nothing and exits 1. Combined with
            # pipefail + `set -e` (from `bash -e {0}` shell wrapper), a 1-exit
            # pipeline kills the whole script silently — bypassing the
            # RETRY_THRESHOLD logic below. Hit this in run 25146361086 when
            # the token expired mid-run.
            ready_count=$(echo "$ready_summary" | grep -o '=True' | wc -l | tr -d ' ' || true)
            not_ready_detail=""
            if [ "$ready_count" != "4" ]; then
              # Find first non-Ready pod for the [warn] message. If kubectl
              # returned empty (transient error), surface that explicitly.
              not_ready_detail=$(echo "$ready_summary" | tr ' ' '\n' | grep -v '=True$' | grep -v '^$' | head -1)
              [ -z "$not_ready_detail" ] && not_ready_detail="(kubectl get pods returned empty)"
            fi
            if [ -n "$not_ready_detail" ]; then
              not_ready_count=$((not_ready_count + 1))
              echo "[warn] NotReady observed: $not_ready_detail ($not_ready_count/$RETRY_THRESHOLD before fail)"
              if [ $not_ready_count -ge $RETRY_THRESHOLD ]; then
                echo "::error::$not_ready_detail NotReady for $not_ready_count consecutive checks"
                exit 1
              fi
            else
              not_ready_count=0
            fi

            # Lease ownership with retry tolerance.
            holder=$(kubectl get lease ci-lossval16-pool-claim -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || true)
            if [ "$holder" != "$JOB_NAME" ]; then
              holder_mismatch_count=$((holder_mismatch_count + 1))
              echo "[warn] Lease holder='${holder:-empty}' != '$JOB_NAME' ($holder_mismatch_count/$RETRY_THRESHOLD before fail)"
              if [ $holder_mismatch_count -ge $RETRY_THRESHOLD ]; then
                echo "::error::Lease lost — holder='${holder:-empty}' for $holder_mismatch_count consecutive checks"
                exit 1
              fi
            else
              holder_mismatch_count=0
            fi

            # Per-pod exit_code (written by run-loss-validation-16.sh on completion).
            done_count=0
            for pod in $POOL_PODS; do
              rc=$(kubectl exec "$pod" -c jax-tpu -- bash -c "test -f /tmp/ramdisk/runs/$RUN_ID/exit_code && cat /tmp/ramdisk/runs/$RUN_ID/exit_code 2>/dev/null" 2>/dev/null || true)
              if [ -n "$rc" ]; then
                done_count=$((done_count + 1))
                if [ "$rc" != "0" ]; then
                  echo "::error::$pod exited rc=$rc"
                  exit 1
                fi
              fi
            done
            if [ $done_count -eq 4 ]; then
              echo "All 4 pods done OK"
              break
            fi

            # Pod-0 progress (visible in workflow log every iteration).
            log_tail=$(kubectl exec ci-lossval16-pool-0 -c jax-tpu -- bash -c "tail -n 60 /tmp/ramdisk/runs/$RUN_ID/log 2>/dev/null" 2>/dev/null || true)
            step=$(echo "$log_tail" | grep -oE 'completed step: [0-9]+' | tail -1 | grep -oE '[0-9]+$' || true)
            if [ -n "$step" ] && [ "$step" != "$last_step" ]; then
              echo "[progress] step=$step  (done_count=$done_count/4)"
              last_step="$step"
            fi

            sleep $POLL_INTERVAL
          done

      - name: Stream pod-0 final log (always)
        if: always()
        env:
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
        run: |
          echo "=== pod-0 log tail ==="
          kubectl exec ci-lossval16-pool-0 -c jax-tpu -- cat "/tmp/ramdisk/runs/$RUN_ID/log" 2>/dev/null | tail -200 || true

      - name: Collect per-pod logs as artifact
        if: always()
        env:
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
        run: |
          mkdir -p logs
          for i in 0 1 2 3; do
            kubectl exec "ci-lossval16-pool-$i" -c jax-tpu -- cat "/tmp/ramdisk/runs/$RUN_ID/log" > "logs/pod-$i.log" 2>/dev/null || true
          done
          ls -la logs/

      - name: Upload per-pod logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lossval16-pool-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 14

      - name: Release pool
        if: always()
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          RUN_ID: ${{ steps.acquire.outputs.RUN_ID }}
        run: |
          # Tears down trainer process groups (SIGTERM grace then SIGKILL),
          # wipes /workspace, /opt/ci-env, /tmp/ramdisk/runs/$RUN_ID, and the
          # libtpu lockfile; releases the Lease. Owner check skips work if
          # another job already won the Lease (rare; can happen if a later
          # workflow took over after a failed-fast detected stale Lease).
          bash .github/ci/release-lossval16-pool.sh
