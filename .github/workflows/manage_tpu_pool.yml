name: Manage TPU Pool

on:
  workflow_dispatch:
    inputs:
      pool:
        description: "Which pool to manage"
        required: true
        type: choice
        default: unit-tests
        options:
          - unit-tests
          - lossval16
      action:
        description: "Preview or apply the pool manifest"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

concurrency:
  group: ci-tpu-pool-manage-${{ github.event.inputs.pool || 'unit-tests' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  manage_pool:
    name: "${{ github.event.inputs.action == 'apply' && 'Apply' || 'Plan' }} TPU pool"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Show target revision
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Action: ${{ github.event.inputs.action }}"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Resolve pool manifest + rollout target
        id: pool
        run: |
          case "${{ github.event.inputs.pool }}" in
            unit-tests)
              echo "manifest=.github/ci/tpu-pool-deployment.yaml" >> "$GITHUB_OUTPUT"
              echo "rollout=deployment/ci-tpu-pool" >> "$GITHUB_OUTPUT"
              echo "label=pool=ci-tpu" >> "$GITHUB_OUTPUT"
              ;;
            lossval16)
              echo "manifest=.github/ci/tpu-lossval16-pool.yaml" >> "$GITHUB_OUTPUT"
              echo "rollout=statefulset/ci-lossval16-pool" >> "$GITHUB_OUTPUT"
              echo "label=pool=ci-lossval16" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown pool: ${{ github.event.inputs.pool }}"; exit 1 ;;
          esac

      - name: Preview pool changes
        run: |
          set +e
          kubectl diff -f "${{ steps.pool.outputs.manifest }}"
          DIFF_EXIT=$?
          set -e

          if [ "$DIFF_EXIT" -eq 0 ]; then
            echo "Pool is already up to date."
          elif [ "$DIFF_EXIT" -eq 1 ]; then
            echo "Pool diff detected."
          else
            echo "kubectl diff failed with exit code $DIFF_EXIT" >&2
            exit "$DIFF_EXIT"
          fi

      - name: Apply pool manifest
        if: github.event.inputs.action == 'apply'
        run: kubectl apply -f "${{ steps.pool.outputs.manifest }}"

      - name: Wait for pool rollout
        if: github.event.inputs.action == 'apply'
        run: kubectl rollout status "${{ steps.pool.outputs.rollout }}" --timeout=15m

      - name: Show pool status
        if: always()
        run: |
          kubectl get "${{ steps.pool.outputs.rollout }}" -o wide || true
          kubectl get pods -l "${{ steps.pool.outputs.label }}" -o wide || true
