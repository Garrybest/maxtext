name: CI Resource Cleanup

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (minimum for GitHub Actions)
  workflow_dispatch:

jobs:
  cleanup_legacy:
    name: "Delete stale CI K8s resources (legacy)"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Delete stale CI resources (per-label thresholds)
        run: |
          FOUND=0

          cleanup_group() {
            local APP_LABEL=$1
            local THRESHOLD_HOURS=$2
            local KINDS=$3
            local THRESHOLD
            THRESHOLD=$(date -u -d "${THRESHOLD_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking $APP_LABEL resources created before $THRESHOLD (${THRESHOLD_HOURS}h threshold)"
            for KIND in $KINDS; do
              ITEMS=$(kubectl get "$KIND" -l "app=$APP_LABEL" \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\n"}{end}' \
                2>/dev/null || true)
              while IFS=$'\t' read -r NAME CREATED; do
                [ -z "$NAME" ] && continue
                if [[ "$CREATED" < "$THRESHOLD" ]]; then
                  echo "  Deleting $KIND/$NAME (created: $CREATED)"
                  kubectl delete "$KIND" "$NAME" --ignore-not-found
                  FOUND=$((FOUND + 1))
                fi
              done <<< "$ITEMS"
            done
          }

          # Short-running pool-based CI (unit tests + smoke test): 4h is plenty
          cleanup_group ci-smoke-test 4 "job service secret"
          cleanup_group ci-unit-tests 4 "job service secret"

          # Long-running 1k-step training JobSets (activeDeadlineSeconds=86400 = 24h);
          # 26h threshold leaves ~2h runway past the deadline for the workflow to self-cleanup.
          cleanup_group tpu-4chips-ling2-job 26 "jobset"
          cleanup_group tpu-32chips-ling2-job 26 "jobset"

          # Loss validation (activeDeadlineSeconds=14400 = 4h);
          # 6h threshold leaves ~2h for workflow self-cleanup past the deadline.
          cleanup_group ci-loss-validation 6 "jobset"

          # Profiling 16 chips (activeDeadlineSeconds=5400 = 1.5h); 3h threshold.
          cleanup_group ci-profiling-16chip 3 "jobset"

          # Profiling 64 chips (activeDeadlineSeconds=10800 = 3h); 5h threshold.
          cleanup_group ci-profiling 5 "jobset"

          echo "Cleanup done. Deleted $FOUND stale resources."

  watchdog:
    name: "Reset stuck TPU pool pods"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Check and reset stuck pods
        run: |
          TIMEOUT_SECONDS=9900  # 165 min (> unit_tests.yml timeout-minutes:120, leaves 45 min for workflow to self-cleanup)
          NOW=$(date -u +%s)

          reset_pod() {
            local POD=$1
            local REASON=$2
            echo "Resetting pod $POD: $REASON"

            # Kill user processes (preserve sleep infinity main process)
            kubectl exec "$POD" -- bash -c \
              'kill -9 $(pgrep -v -f "sleep infinity" | grep -v "^1$") 2>/dev/null || true' \
              || true

            # Clean workspace
            kubectl exec "$POD" -- find /workspace /opt/ci-env -mindepth 1 -delete 2>/dev/null || true

            # Atomic reset: label + annotations in one replace call
            POD_JSON=$(kubectl get pod "$POD" -o json 2>/dev/null || true)
            if [ -n "${POD_JSON:-}" ]; then
              echo "$POD_JSON" \
                | jq '
                    .metadata.labels.status = "idle"
                    | del(.metadata.annotations["ci.primatrix/claimed-by"])
                    | del(.metadata.annotations["ci.primatrix/claimed-at"])
                    | del(.metadata.annotations["ci.primatrix/task-type"])
                  ' \
                | kubectl replace -f - \
                || echo "WARNING: atomic reset failed for pod $POD" >&2
            fi
          }

          echo "=== TPU Pool Watchdog ==="
          kubectl get pods -l "pool=ci-tpu,status=busy" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.annotations.ci\.primatrix/claimed-at}{"\t"}{.metadata.annotations.ci\.primatrix/claimed-by}{"\n"}{end}' \
          | while IFS=$'\t' read -r POD CLAIMED_AT CLAIMED_BY; do
              [ -z "$POD" ] && continue

              # Case 1: busy but no claimed-at → broken acquire, reset immediately
              if [ -z "$CLAIMED_AT" ]; then
                reset_pod "$POD" "busy with no claimed-at (broken acquire by ${CLAIMED_BY:-unknown})"
                continue
              fi

              # Case 2: busy for too long → stuck task, reset
              CLAIMED_TS=$(date -u -d "$CLAIMED_AT" +%s)
              ELAPSED=$((NOW - CLAIMED_TS))

              if [ "$ELAPSED" -gt "$TIMEOUT_SECONDS" ]; then
                reset_pod "$POD" "claimed by $CLAIMED_BY ${ELAPSED}s ago (timeout)"
              else
                echo "Pod $POD: busy for ${ELAPSED}s by $CLAIMED_BY (OK, under threshold)"
              fi
            done

          echo "=== Watchdog complete ==="
