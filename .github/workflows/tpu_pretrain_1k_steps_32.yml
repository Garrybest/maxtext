name: TPU Pretrain 1K Steps (32 chips)

on:
  workflow_dispatch:
    inputs:
      target_cluster:
        description: "Cluster target (default = repo secrets, lingbo = PR #156 lingbo, tpu_training = on-demand JobSet on tpu_training cluster)"
        required: false
        type: choice
        default: default
        options: [default, lingbo, tpu_training]
      branch:
        description: "Branch to run on (defaults to the branch you triggered from)"
        required: false
        type: string
      use_fp8_blockwise:
        description: "Enable FP8 blockwise quantization (Tokamax GMM path)"
        required: false
        type: boolean
        default: false

concurrency:
  group: tpu-1k-steps-32
  cancel-in-progress: true

jobs:
  tpu_1k_steps_32:
    name: "1000-step pretrain on 32 TPU chips (EP=8, DP=8)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Verify *_LINGBO secrets are populated
        if: inputs.target_cluster == 'lingbo'
        env:
          WIF_LINGBO: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO }}
          SA_LINGBO: ${{ secrets.GCP_SERVICE_ACCOUNT_LINGBO }}
          CLUSTER_LINGBO: ${{ secrets.GKE_CLUSTER_LINGBO }}
          LOCATION_LINGBO: ${{ secrets.GKE_LOCATION_LINGBO }}
        run: |
          missing=()
          [ -z "$WIF_LINGBO" ] && missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO)
          [ -z "$SA_LINGBO" ] && missing+=(GCP_SERVICE_ACCOUNT_LINGBO)
          [ -z "$CLUSTER_LINGBO" ] && missing+=(GKE_CLUSTER_LINGBO)
          [ -z "$LOCATION_LINGBO" ] && missing+=(GKE_LOCATION_LINGBO)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::target_cluster=lingbo but these secrets are empty: ${missing[*]} - refusing to silently fall back to the default cluster."
            exit 1
          fi

      - name: Verify *_TPU_TRAINING secrets are populated
        if: inputs.target_cluster == 'tpu_training'
        env:
          WIF_TPU_TRAINING: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TPU_TRAINING }}
          SA_TPU_TRAINING: ${{ secrets.GCP_SERVICE_ACCOUNT_TPU_TRAINING }}
          CLUSTER_TPU_TRAINING: ${{ secrets.GKE_CLUSTER_TPU_TRAINING }}
          LOCATION_TPU_TRAINING: ${{ secrets.GKE_LOCATION_TPU_TRAINING }}
        run: |
          missing=()
          [ -z "$WIF_TPU_TRAINING" ] && missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER_TPU_TRAINING)
          [ -z "$SA_TPU_TRAINING" ] && missing+=(GCP_SERVICE_ACCOUNT_TPU_TRAINING)
          [ -z "$CLUSTER_TPU_TRAINING" ] && missing+=(GKE_CLUSTER_TPU_TRAINING)
          [ -z "$LOCATION_TPU_TRAINING" ] && missing+=(GKE_LOCATION_TPU_TRAINING)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for target_cluster=tpu_training: ${missing[*]}"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.target_cluster == 'tpu_training' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_TPU_TRAINING || (inputs.target_cluster == 'lingbo' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_LINGBO || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER) }}
          service_account: ${{ inputs.target_cluster == 'tpu_training' && secrets.GCP_SERVICE_ACCOUNT_TPU_TRAINING || (inputs.target_cluster == 'lingbo' && secrets.GCP_SERVICE_ACCOUNT_LINGBO || secrets.GCP_SERVICE_ACCOUNT) }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ inputs.target_cluster == 'tpu_training' && secrets.GKE_CLUSTER_TPU_TRAINING || (inputs.target_cluster == 'lingbo' && secrets.GKE_CLUSTER_LINGBO || secrets.GKE_CLUSTER) }}
          location: ${{ inputs.target_cluster == 'tpu_training' && secrets.GKE_LOCATION_TPU_TRAINING || (inputs.target_cluster == 'lingbo' && secrets.GKE_LOCATION_LINGBO || secrets.GKE_LOCATION) }}

      - name: Generate unique job name
        id: job
        run: |
          JOB_NAME="ci-1k32-run${GITHUB_RUN_NUMBER}"
          JOB_NAME=$(echo "$JOB_NAME" | tr '[:upper:]' '[:lower:]' | head -c 63)
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch name for K8s label
        id: branch
        run: |
          RAW="${{ inputs.branch || github.ref_name }}"
          LABEL=$(echo "$RAW" | sed 's/[^a-zA-Z0-9._-]/-/g' | head -c 63 | sed 's/^[^a-zA-Z0-9]//;s/[^a-zA-Z0-9]$//')
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Cleanup previous JobSets for this branch
        run: |
          BRANCH_LABEL="${{ steps.branch.outputs.label }}"
          echo "Cleaning up leftover JobSets for branch=$BRANCH_LABEL..."
          kubectl delete jobsets -l "app=tpu-32chips-ling2-job,repo-branch=$BRANCH_LABEL" --ignore-not-found

      - name: Deploy JobSet
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          BRANCH_LABEL: ${{ steps.branch.outputs.label }}
          USER: ${{ github.actor }}
          USE_FP8_BLOCKWISE: ${{ inputs.use_fp8_blockwise }}
        run: |
          echo "=== 1K-step Pretrain (32 chips) Configuration ==="
          echo "  Branch:        $BRANCH"
          echo "  JobSet:        $JOB_NAME"
          echo "  Owner:         $USER"
          echo "  FP8 blockwise: $USE_FP8_BLOCKWISE"
          echo "  Parallelism:   EP=8, DP=8 (GBS=5120)"
          echo "================================================"

          envsubst '$JOB_NAME $BRANCH $BRANCH_LABEL $USER $USE_FP8_BLOCKWISE' \
            < .github/ci/tpu-32chips-ling2-job.yaml \
            | kubectl apply -f -

      - name: Wait for worker pods to start
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          echo "Waiting for worker pods of JobSet $JOB_NAME (8 pods expected)..."
          for i in $(seq 1 90); do
            READY=$(kubectl get pods \
              -l "jobset.sigs.k8s.io/jobset-name=$JOB_NAME" \
              --field-selector=status.phase=Running \
              -o name 2>/dev/null | wc -l | tr -d ' ')
            echo "  Running pods: $READY/8 ($i/90)"
            if [ "$READY" -ge 8 ]; then
              echo "All 8 pods are running!"
              break
            fi
            sleep 10
          done

      - name: Stream logs & wait for completion
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"

          # Stream logs from coordinator pod (completion index 0)
          POD_0=$(kubectl get pods \
            -l "jobset.sigs.k8s.io/jobset-name=$JOB_NAME,batch.kubernetes.io/job-completion-index=0" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "$POD_0" ]; then
            echo "ERROR: could not locate coordinator pod (completion index 0) for JobSet $JOB_NAME"
            kubectl get jobset "$JOB_NAME" -o wide || true
            kubectl get pods -l "jobset.sigs.k8s.io/jobset-name=$JOB_NAME" -o wide || true
            exit 1
          fi

          echo "Streaming logs from coordinator $POD_0"
          kubectl logs -f "$POD_0" -c jax-tpu || true

          # Wait for JobSet terminal condition
          if kubectl wait --for=condition=Completed jobset/"$JOB_NAME" --timeout=60s 2>/dev/null; then
            echo "JobSet completed successfully!"
            exit 0
          fi
          if kubectl wait --for=condition=Failed jobset/"$JOB_NAME" --timeout=60s 2>/dev/null; then
            echo "JobSet failed! Dumping last 50 lines from all 8 pods:"
            for idx in 0 1 2 3 4 5 6 7; do
              POD=$(kubectl get pods \
                -l "jobset.sigs.k8s.io/jobset-name=$JOB_NAME,batch.kubernetes.io/job-completion-index=$idx" \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              if [ -n "$POD" ]; then
                echo "=== Logs from pod $POD (index $idx) ==="
                kubectl logs "$POD" -c jax-tpu --tail=50 2>/dev/null || true
              fi
            done
            exit 1
          fi
          echo "JobSet in unexpected state:"
          kubectl get jobset/"$JOB_NAME" -o wide
          exit 1

      - name: Cleanup
        if: always()
        run: |
          JOB_NAME="${{ steps.job.outputs.name }}"
          kubectl delete jobset "$JOB_NAME" --ignore-not-found
